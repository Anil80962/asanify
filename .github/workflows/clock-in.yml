name: Asanify clock-in (multi-employee)

on:
  schedule:
    # Primary trigger: Vercel cron calls workflow_dispatch at 10:00 IST exactly.
    # This schedule is a fallback in case Vercel misses (fires 30 min later).
    # GitHub cron UTC: 10:00 IST = 04:30 UTC  |  fallback 10:30 IST = 05:00 UTC
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (verify each login only, no clock-in)"
        type: boolean
        default: true
      employee_id:
        description: "Run for a single employee only (leave blank for all)"
        type: string
        default: ""

concurrency:
  group: asanify-clock-in
  cancel-in-progress: false

jobs:
  # Turn employees.json into a job matrix. Secret names are derived by
  # convention: ASANIFY_STATE_<ID> / ASANIFY_EMPCODE_<ID> (id uppercased).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        env:
          EMPLOYEE_FILTER: ${{ github.event.inputs.employee_id }}
        run: |
          node -e '
            const r = require("./employees.json");
            const filter = process.env.EMPLOYEE_FILTER || "";
            let inc = (r.employees||[])
              .filter(e => (typeof e === "string") || e.enabled !== false)
              .map(e => {
                const id = typeof e === "string" ? e : e.id;
                const U = String(id).toUpperCase();
                return { id, stateSecret: "ASANIFY_STATE_"+U, empSecret: "ASANIFY_EMPCODE_"+U };
              });
            if (filter) inc = inc.filter(e => e.id === filter);
            if (!inc.length) { console.log("No active employees — nothing to do."); process.exit(0); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              "matrix=" + JSON.stringify({ include: inc }) + "\n");
          '

  clock-in:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false # one employee failing must not skip the others
      max-parallel: 1 # serialize logins — gentler on Google's bot heuristics
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: "Clock in: ${{ matrix.id }}"
        env:
          ASANIFY_STATE_B64: ${{ secrets[matrix.stateSecret] }}
          ASANIFY_EMPCODE: ${{ secrets[matrix.empSecret] }}
        run: |
          if [ -z "$ASANIFY_STATE_B64" ]; then
            echo "::error::Missing secret ${{ matrix.stateSecret }} for '${{ matrix.id }}'. Add it (see ONBOARDING.md)."
            exit 1
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node clock-in.mjs --dry-run
          else
            node clock-in.mjs
          fi
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asanify-failure-${{ matrix.id }}
          path: |
            auth/failure-*.png
            auth/failure-*.html
          if-no-files-found: ignore
          retention-days: 7
